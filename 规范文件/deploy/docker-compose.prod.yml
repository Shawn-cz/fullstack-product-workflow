# 软件产品设计与全栈交付工作流 v1.4.1 — 生产编排模板 (STD-OPS-01 / STD-OPS-07)
# 架构：Caddy（自动 HTTPS）→ App（最小权限 APP_DB_USER）→ Migrate（启动前迁移且失败即停）→ PostgreSQL 16（仅内网隔离）
# 启动方式（统一维护单份 .env.production）：
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: prod_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请在 .env.production 配置域名，如 app.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod_migrate
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["node", "scripts/run-migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_db_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod_app
    restart: unless-stopped
    # 仅显式注入运行账号与业务配置白名单，严禁把 POSTGRES_USER / POSTGRES_PASSWORD 暴露给 app 容器
    environment:
      NODE_ENV: production
      PORT: "3001"
      SERVICE_NAME: ${SERVICE_NAME:-team-fullstack-api}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_DOMAIN: ${APP_DOMAIN:?请在 .env.production 配置域名，如 app.example.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-app_sid}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_MS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env.production 填写 POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?请在 .env.production 填写最小权限应用账号 APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?请在 .env.production 填写强随机 APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - public_net
      - internal_db_net

  postgres:
    image: postgres:16-alpine
    container_name: prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env.production 填写迁移管理账号 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 填写强随机 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env.production 填写 POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?请在 .env.production 填写最小权限应用账号 APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?请在 .env.production 填写强随机 APP_DB_PASSWORD}
    # 严禁在生产环境对外映射 ports: 5432:5432，数据库仅允许 internal_db_net 内网访问
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./deploy/init-app-user.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal_db_net

networks:
  public_net:
  internal_db_net:
    internal: true

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
