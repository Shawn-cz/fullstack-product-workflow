# 软件产品设计与全栈交付工作流 v1.4.1 — GitHub Actions CI 四道门禁流水线模板
# 启用方法：通过 starter/init-project.mjs 自动生成，或手动复制到业务项目的 .github/workflows/ci.yml。
# 对应规则：STD-GOV-05（索引树）、STD-SEC-05（安全红线）、STD-QA-13（双向闭环四道门禁）、STD-AUD-07（指纹锁定）、STD-ARC-09（PostgreSQL 同构）

name: Fullstack Quality & Traceability Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    name: Gates 1-4 (Traceability / Static / PostgreSQL Test / Fingerprint)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password_ci
          POSTGRES_DB: app_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app_user:app_password_ci@localhost:5432/app_test_db?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      # ============================================================
      # Gate 1: 需求 ↔ 验收 ↔ 测试 ↔ 契约 闭环与项目资产索引树新鲜度门禁
      # ============================================================
      - name: "Gate 1: Verify REQ-AC-TEST traceability, PostgreSQL & index-tree freshness"
        run: node scripts/verify-gates.mjs --gate=1

      # ============================================================
      # Gate 2: 静态质量、React/Node 类型检查与前置防呆扫描
      # ============================================================
      - name: "Gate 2a: Static baseline scan (.skip/.only/.fixme/empty catch/secrets)"
        run: node scripts/verify-gates.mjs --gate=2

      - name: "Gate 2b: Prisma Schema & TypeScript & ESLint checks"
        run: |
          npx prisma validate
          npx prisma generate
          npm run check

      # ============================================================
      # Gate 3: PostgreSQL 真实容器迁移、构建与单元/集成/端到端测试
      # ============================================================
      - name: "Gate 3a: Deploy migrations to PostgreSQL 16 container"
        run: npx prisma migrate deploy

      - name: "Gate 3a-2: Seed 4 synthetic RBAC test accounts"
        run: npm run db:seed

      - name: "Gate 3b: Run Vitest unit & integration tests against PostgreSQL"
        id: vitest_check
        shell: bash
        run: |
          HAS_VITEST=$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            function walk(dir, out = []) {
              if (!fs.existsSync(dir)) return out;
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                if (ent.name === "node_modules" || ent.name === "dist" || ent.name === "dist-server") continue;
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) {
                  if (full.replace(/\\/g, "/").startsWith("tests/e2e")) continue;
                  walk(full, out);
                } else if (/\.(?:test|spec)\.tsx?$/.test(ent.name)) {
                  out.push(full);
                }
              }
              return out;
            }
            const files = ["tests", "test", "src", "server"].flatMap((d) => walk(d));
            process.stdout.write(files.length > 0 ? "true" : "false");
          ')
          echo "has_vitest=$HAS_VITEST" >> "$GITHUB_OUTPUT"
          if [ "$HAS_VITEST" = "true" ]; then
            npm test
          else
            echo "ℹ️ 当前尚无非 E2E 单元/集成测试文件，跳过 Vitest。"
          fi

      - name: "Gate 3c: Build React frontend (dist/) & compiled Node server (dist-server/)"
        run: npm run build

      - name: "Gate 3d-1: Detect Playwright E2E / RBAC specs"
        id: detect_e2e
        shell: bash
        run: |
          HAS_E2E=$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            function walk(dir, out = []) {
              if (!fs.existsSync(dir)) return out;
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full, out);
                else if (/\.spec\.tsx?$/.test(ent.name)) out.push(full);
              }
              return out;
            }
            process.stdout.write(walk("tests/e2e").length > 0 ? "true" : "false");
          ')
          echo "has_e2e=$HAS_E2E" >> "$GITHUB_OUTPUT"
          if [ "$HAS_E2E" = "true" ]; then
            echo "✅ 检测到 tests/e2e/*.spec.ts，将自动执行 Playwright 双账号越权与端到端验收。"
          else
            echo "ℹ️ 未检测到 tests/e2e/*.spec.ts，跳过 Gate 3d。"
          fi

      - name: "Gate 3-enforce: Fail if S2+ REQ/AC exist without any runnable tests"
        shell: bash
        run: |
          if [ "${{ steps.vitest_check.outputs.has_vitest }}" != "true" ] && [ "${{ steps.detect_e2e.outputs.has_e2e }}" != "true" ]; then
            HAS_REQ=$(node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              function walk(dir, out = []) {
                if (!fs.existsSync(dir)) return out;
                for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, ent.name);
                  const rel = full.replace(/\\/g, "/");
                  if (ent.isDirectory()) {
                    if (rel === "docs/evidence" || rel === "docs/archive") continue;
                    walk(full, out);
                  } else if (ent.name.endsWith(".md")) {
                    out.push(full);
                  }
                }
                return out;
              }
              const found = walk("docs").some((f) => /\b(REQ|AC)-[0-9]+\b/.test(fs.readFileSync(f, "utf8")));
              process.stdout.write(found ? "true" : "false");
            ')
            if [ "$HAS_REQ" = "true" ]; then
              echo "❌ docs/ 已声明 REQ/AC，但未检测到任何可执行的 Vitest 或 Playwright 测试！"
              exit 1
            fi
          fi

      - name: "Gate 3d-2: Install Playwright Chromium & run automated RBAC/IDOR E2E"
        if: steps.detect_e2e.outputs.has_e2e == 'true'
        run: |
          # Idempotent re-seed in case Vitest mutated database rows during Gate 3b
          npm run db:seed
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: "Gate 3d-3: Upload Playwright visual HTML report & screenshots"
        if: always() && steps.detect_e2e.outputs.has_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rbac-report
          path: |
            docs/evidence/playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # Gate 4: 五重指纹一致性校验（契约 / Schema / 锁文件 / 源码树 / 交付资产）
      # ============================================================
      - name: "Gate 4: Verify SHA-256 contract, schema, lockfile & source fingerprints"
        run: node scripts/verify-gates.mjs --gate=4
