# 软件产品设计与全栈交付工作流 v1.3.1 — GitHub Actions CI 四道门禁流水线模板
# 启用方法：通过 starter/init-project.mjs 自动生成，或手动复制到业务项目的 .github/workflows/ci.yml。
# 对应规则：STD-GOV-05（索引树）、STD-SEC-05（安全红线）、STD-QA-13（双向闭环四道门禁）、STD-AUD-07（指纹锁定）、STD-ARC-09（PostgreSQL 同构）

name: Fullstack Quality & Traceability Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    name: Gates 1-4 (Traceability / Static / PostgreSQL Test / Fingerprint)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password_ci
          POSTGRES_DB: app_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app_user:app_password_ci@localhost:5432/app_test_db?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      # ============================================================
      # Gate 1: 需求 ↔ 验收 ↔ 测试 ↔ 契约 闭环与项目资产索引树新鲜度门禁
      # ============================================================
      - name: "Gate 1: Verify REQ-AC-TEST traceability, PostgreSQL & index-tree freshness"
        run: node scripts/verify-gates.mjs --gate=1

      # ============================================================
      # Gate 2: 静态质量、React/Node 类型检查与前置防呆扫描
      # ============================================================
      - name: "Gate 2a: Static baseline scan (.skip/.only/.fixme/empty catch/secrets)"
        run: node scripts/verify-gates.mjs --gate=2

      - name: "Gate 2b: Prisma Schema & TypeScript & ESLint checks"
        run: |
          npx prisma validate
          npx prisma generate
          npm run check

      # ============================================================
      # Gate 3: PostgreSQL 真实容器迁移、构建与单元/集成/端到端测试
      # ============================================================
      - name: "Gate 3a: Deploy migrations to PostgreSQL 16 container"
        run: npx prisma migrate deploy

      - name: "Gate 3a-2: Seed 4 synthetic RBAC test accounts"
        run: npm run db:seed

      - name: "Gate 3b: Run Vitest unit & integration tests against PostgreSQL"
        shell: bash
        run: |
          if find tests src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) 2>/dev/null | grep -q .; then
            npm test
          else
            echo "ℹ️ 当前为 S0 初始底座（尚无 .test.ts 单元测试文件），跳过 Vitest。"
          fi

      - name: "Gate 3c: Build React frontend (dist/) & compiled Node server (dist-server/)"
        run: npm run build

      - name: "Gate 3d-1: Detect Playwright E2E / RBAC specs"
        id: detect_e2e
        shell: bash
        run: |
          if [ -d "tests/e2e" ] && find tests/e2e -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 tests/e2e/*.spec.ts，将自动执行 Playwright 双账号越权与端到端验收。"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 当前尚未进入 S6 E2E 用例编写阶段（tests/e2e/ 无 .spec.ts），跳过 Gate 3d。"
          fi

      - name: "Gate 3d-2: Install Playwright Chromium & run automated RBAC/IDOR E2E"
        if: steps.detect_e2e.outputs.has_e2e == 'true'
        run: |
          # Idempotent re-seed in case Vitest mutated database rows during Gate 3b
          npm run db:seed
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: "Gate 3d-3: Upload Playwright visual HTML report & screenshots"
        if: always() && steps.detect_e2e.outputs.has_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rbac-report
          path: |
            docs/evidence/playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # Gate 4: 四重指纹一致性校验（契约 / Schema / 锁文件 / 源码树）
      # ============================================================
      - name: "Gate 4: Verify SHA-256 contract, schema, lockfile & source fingerprints"
        run: node scripts/verify-gates.mjs --gate=4
