# 本地 PostgreSQL 16 同构容器配置 (v0.9.0)
# 彻底替代 SQLite，确保零经验成员本地开发、黑盒查库与 CI/生产环境 100% 一致。
# 使用方式：在项目根目录运行 `docker compose -f docker-compose.postgres.yml up -d`

services:
  postgres:
    image: postgres:16-alpine
    container_name: team_project_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_dev_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
