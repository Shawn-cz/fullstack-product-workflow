# 本地 PostgreSQL 16 同构容器配置 (v1.3.1)
# 替代 SQLite，使本地开发、黑盒查库与 CI/生产保持同一 PostgreSQL 16 引擎。
# 不写死 container_name，允许同一台电脑并行开发多个项目（按目录名自动隔离容器与数据卷）。
# 使用方式：在项目根目录运行 `docker compose -f docker-compose.postgres.yml up -d`

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_dev_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
