# 软件产品设计与全栈交付工作流 v1.4.0 — 母版仓库洁净底座隔离冒烟流水线
# 职责：每次 Push / PR 自动在隔离环境运行 maintain-workflow --check、Mode A 初始化、依赖安装、数据库迁移/种子、门禁、编译构建、真实认证吊销与生产 Dockerfile 构建冒烟验证。

name: Workflow Template Clean-Room Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template-clean-room-smoke:
    name: Clean-Room Starter Init, Auth Runtime & Docker Build Smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password_ci
          POSTGRES_DB: app_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app_user:app_password_ci@127.0.0.1:5432/app_test_db?schema=public
      TEST_DATABASE_URL: postgresql://app_user:app_password_ci@127.0.0.1:5432/app_test_db?schema=public
      PORT: "3001"
      FRONTEND_PORT: "5173"

    steps:
      - name: Checkout template repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run workflow template structural check
        run: node 规范文件/ci/maintain-workflow.mjs --check

      - name: Clean-room Mode A init, install, migrate, seed, gates, check & build
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="/tmp/wf-ci-smoke"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          cp -R 规范文件 "$SMOKE_DIR/规范文件"
          cp .gitattributes "$SMOKE_DIR/.gitattributes"

          cd "$SMOKE_DIR"
          git init
          git config user.email "ci-smoke@example.test"
          git config user.name "Workflow CI Smoke"

          node 规范文件/starter/init-project.mjs --target .
          cp .env.example .env

          npm install
          npm run hooks:install
          npx prisma migrate dev --name init
          npm run db:seed
          npm run index:build
          npm run gates
          npm run check
          npm run build

      - name: Auth runtime & PostgreSQL session revocation smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wf-ci-smoke
          node dist-server/index.mjs > /tmp/wf-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/readyz > /dev/null; then
              break
            fi
            sleep 1
          done

          node -e '
            const assert = require("node:assert/strict");
            const base = "http://127.0.0.1:3001";
            (async () => {
              const hz = await fetch(base + "/healthz");
              assert.equal(hz.status, 200, "/healthz must be 200");
              const rz = await fetch(base + "/readyz");
              assert.equal(rz.status, 200, "/readyz must be 200 after migration");

              const badCt = await fetch(base + "/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "text/plain", Origin: base },
                body: JSON.stringify({ email: "member_a@example.test", password: "TestOnly_MemberA!2026" })
              });
              assert.equal(badCt.status, 415, "text/plain login must be blocked with 415");

              const login = await fetch(base + "/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json", Origin: base },
                body: JSON.stringify({ email: "member_a@example.test", password: "TestOnly_MemberA!2026" })
              });
              assert.equal(login.status, 200, "seeded member_a login must succeed");
              const loginBody = await login.json();
              assert.equal(loginBody.code, "OK");
              assert.ok(loginBody.requestTraceId);
              assert.ok(loginBody.timestamp);
              const setCookie = login.headers.get("set-cookie") || "";
              assert.match(setCookie, /HttpOnly/i);
              const cookieHeader = setCookie.split(";")[0];

              const meOk = await fetch(base + "/api/auth/me", {
                headers: { Cookie: cookieHeader }
              });
              assert.equal(meOk.status, 200, "/api/auth/me with session cookie must be 200");

              const logout = await fetch(base + "/api/auth/logout", {
                method: "POST",
                headers: { Cookie: cookieHeader, Origin: base }
              });
              assert.equal(logout.status, 200, "POST /api/auth/logout must succeed");

              const replay = await fetch(base + "/api/auth/me", {
                headers: { Cookie: cookieHeader }
              });
              assert.equal(replay.status, 401, "replaying pre-logout cookie must return 401");
              console.log("✅ Auth runtime & PostgreSQL session revocation smoke passed.");
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: Production Dockerfile build smoke check
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wf-ci-smoke
          docker build -t wf-smoke-app:ci .
